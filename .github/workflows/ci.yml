name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One entry point, the same one a developer runs. A pipeline that builds differently from the
  # machine it is meant to protect eventually disagrees with it, and the disagreement always
  # surfaces at the worst moment.
  ci:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Not pinned yet on purpose: the first run records what the image actually provides, and the
      # version is pinned in a follow-up commit against those facts rather than against a guess.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install tools
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      # Builds the package, runs the tests, checks the layering rule, generates the demo project
      # and builds it for a simulator.
      - name: fastlane ci
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: fastlane ci

      - name: Export build results
        if: always()
        run: |
          find Demo/.build-demo -name '*.xcresult' -maxdepth 4 -print0 \
            | xargs -0 -I{} xcrun xcresulttool get build-results --path {} --format json \
            > build-results.json || true
          wc -c build-results.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: build-results.json
          if-no-files-found: warn
