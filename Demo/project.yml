# The Xcode project is generated, not committed.
#
# SwiftPM has no product type for an iOS application, so a project file is unavoidable — but a
# checked-in pbxproj is a binary-shaped text file that merges badly and drifts from the manifest
# without anyone noticing. Generating it from this file keeps the target definition reviewable and
# makes "the demo builds" reproducible from a clean checkout: `xcodegen generate`.
name: RenderBenchDemo

options:
  bundleIdPrefix: com.ryhormar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  RenderBench:
    path: ..

targets:
  RenderBenchDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Written out separately because `sources` is the only place a generated project learns
      # about a file: an asset catalogue that is not listed here does not reach the target, and
      # the app builds on this machine off a stale build folder while failing on a clean clone.
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ryhormar.renderbench
        PRODUCT_NAME: RenderBenchDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signing stays off in the file and is supplied on the command line for a device build.
        # A team baked in here would fail every build on a machine that does not hold that team's
        # certificate — the CI runner holds none, and the simulator needs no signature at all.
        CODE_SIGNING_ALLOWED: NO
        # An asset catalogue makes the compiler look for an app icon named "AppIcon" and fail
        # without one. This demo ships no icon, and saying so is more honest than an empty icon
        # set that looks like an unfinished one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: RenderBench
        product: BenchCore
      - package: RenderBench
        product: BenchScales
      - package: RenderBench
        product: BenchDownsampling
      - package: RenderBench
        product: BenchGenerators
      - package: RenderBench
        product: BenchRuntime
      - package: RenderBench
        product: BenchHost
      - package: RenderBench
        product: CanvasBackend
      - package: RenderBench
        product: CoreAnimationBackend
      - package: RenderBench
        product: MetalBackend
      - package: RenderBench
        product: SwiftChartsBackend
      - package: RenderBench
        product: ShapePathBackend
      - package: RenderBench
        product: CoreImageBackend
      - package: RenderBench
        product: SceneKitBackend
      - package: RenderBench
        product: ShaderBackend
      - package: RenderBench
        product: MetalComputeBackend

  RenderBenchDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RenderBenchDemo
      # `ShaderBackend`'s shader only compiles inside this app's own bundle, so the equivalence
      # test that proves it works links the package product directly rather than reaching it
      # through `RenderBenchDemo`.
      - package: RenderBench
        product: ShaderBackend
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  RenderBenchDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    # Drives the app as a black box through `XCUIApplication()`, launched in its own process — no
    # package products to link, only the app target it launches and inspects.
    dependencies:
      - target: RenderBenchDemo
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RenderBenchDemo:
    build:
      targets:
        RenderBenchDemo: all
        RenderBenchDemoTests: [test]
        RenderBenchDemoUITests: [test]
    test:
      targets:
        - RenderBenchDemoTests
        - name: RenderBenchDemoUITests
          # The device sweep is a tool, not a test of anything. Left in the scheme's test action it
          # would run on a simulator in every lane — ninety seconds of it — and print readings that
          # look exactly like measurements while describing the host's GPU. It is invoked by name,
          # against a device, and nowhere else.
          skippedTests:
            - DeviceSweepTests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  # The device sweep, and nothing else.
  #
  # It needs its own scheme because `skippedTests` in the scheme above outranks `-only-testing:` on
  # the command line: asking for DeviceSweepTests by name printed `** TEST SUCCEEDED **` having run
  # zero tests, and the same mechanism would have hidden a genuinely broken sweep.
  #
  # Release, unlike the scheme above, whose test action is Debug. A sweep reads frame rates off a
  # real device, and an unoptimised build is not the one anyone ships — the readings taken through
  # the other scheme describe `-Onone` and must be labelled that way wherever they are quoted.
  RenderBenchDemoSweep:
    build:
      targets:
        RenderBenchDemo: all
        RenderBenchDemoUITests: [test]
    test:
      config: Release
      targets:
        - name: RenderBenchDemoUITests
          selectedTests:
            - DeviceSweepTests
    run:
      config: Release

  # The scheme a measurement is taken with, and the only one whose binary is the one that would
  # ship. The scheme above builds the unit test target alongside the app, and that target uses
  # `@testable import`, which in Release needs `ENABLE_TESTABILITY=YES` on the whole build — so a
  # run taken through it measures a binary with testability enabled, which the release build does
  # not have. This one builds the application and nothing else, so there is nothing to enable.
  RenderBenchDemoMeasure:
    build:
      targets:
        RenderBenchDemo: [run, profile, archive]
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
