# The Xcode project is generated, not committed.
#
# SwiftPM has no product type for an iOS application, so a project file is unavoidable — but a
# checked-in pbxproj is a binary-shaped text file that merges badly and drifts from the manifest
# without anyone noticing. Generating it from this file keeps the target definition reviewable and
# makes "the demo builds" reproducible from a clean checkout: `xcodegen generate`.
name: RenderBenchDemo

options:
  bundleIdPrefix: dev.renderbench
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  RenderBench:
    path: ..

targets:
  RenderBenchDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.renderbench.demo
        PRODUCT_NAME: RenderBenchDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: RenderBench
        product: BenchCore
      - package: RenderBench
        product: BenchScales
      - package: RenderBench
        product: BenchDownsampling
      - package: RenderBench
        product: BenchGenerators
      - package: RenderBench
        product: BenchRuntime
      - package: RenderBench
        product: BenchHost
      - package: RenderBench
        product: CanvasBackend
      - package: RenderBench
        product: CoreAnimationBackend
      - package: RenderBench
        product: MetalBackend
      - package: RenderBench
        product: SwiftChartsBackend
      - package: RenderBench
        product: ShapePathBackend
      - package: RenderBench
        product: CoreImageBackend
      - package: RenderBench
        product: SceneKitBackend
      - package: RenderBench
        product: ShaderBackend
      - package: RenderBench
        product: MetalComputeBackend

  RenderBenchDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RenderBenchDemo
      # `ShaderBackend`'s shader only compiles inside this app's own bundle, so the equivalence
      # test that proves it works links the package product directly rather than reaching it
      # through `RenderBenchDemo`.
      - package: RenderBench
        product: ShaderBackend
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  RenderBenchDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    # Drives the app as a black box through `XCUIApplication()`, launched in its own process — no
    # package products to link, only the app target it launches and inspects.
    dependencies:
      - target: RenderBenchDemo
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RenderBenchDemo:
    build:
      targets:
        RenderBenchDemo: all
        RenderBenchDemoTests: [test]
        RenderBenchDemoUITests: [test]
    test:
      targets:
        - RenderBenchDemoTests
        - RenderBenchDemoUITests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
